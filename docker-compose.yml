
services:
  src:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_CONTAINER_NAME}
    volumes:
      - ./src:/var/www/html:Z
      - ./apache/sites-enabled:/etc/apache2/sites-enabled:Z
      - ./portable:/portable:Z 
    networks:
      - laravel_network
    environment:
      - DB_HOST=${DB_HOST}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - mysql
    ports:
        - "8001:8001"

  mysql:
    image: mysql:latest
    container_name: ${DB_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel_network
    ports:
      - "${DB_PORT}:3306"

  redis:
    image: redis:latest
    container_name: ${REDIS_CONTAINER_NAME}
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - laravel_network
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

networks:
  laravel_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
